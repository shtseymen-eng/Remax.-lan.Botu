name: REMAX desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows
          - runner: macos-15
            platform: macOS
    runs-on: ${{ matrix.runner }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and bundled browser
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install chromium
      - name: Regression tests
        run: python -m pytest -q
      - name: Preserve macOS browser bundle before freezing
        if: runner.os == 'macOS'
        run: |
          python -c 'import playwright, pathlib, shutil, os; source=pathlib.Path(playwright.__file__).parent / "driver/package/.local-browsers"; shutil.move(str(source), os.environ["RUNNER_TEMP"] + "/remax-browsers")'
      - name: Build desktop package
        run: python -m PyInstaller --noconfirm --clean --windowed --name REMAX_Ilan_Botu --collect-all playwright --collect-data remax_bot launcher.py
      - name: Windows offline package test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/REMAX_Ilan_Botu/REMAX_Ilan_Botu.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged offline self-test failed' }
          Compress-Archive -Path dist/REMAX_Ilan_Botu -DestinationPath REMAX-Ilan-Botu-Windows.zip
          (Get-FileHash REMAX-Ilan-Botu-Windows.zip -Algorithm SHA256).Hash.ToLower() + '  REMAX-Ilan-Botu-Windows.zip' | Set-Content REMAX-Ilan-Botu-Windows.zip.sha256 -Encoding ASCII
      - name: macOS offline package test
        if: runner.os == 'macOS'
        run: |
          ditto "$RUNNER_TEMP/remax-browsers" dist/REMAX_Ilan_Botu.app/Contents/Resources/browsers
          codesign --force --deep --sign - dist/REMAX_Ilan_Botu.app
          dist/REMAX_Ilan_Botu.app/Contents/MacOS/REMAX_Ilan_Botu --self-test
          codesign --verify --deep --strict dist/REMAX_Ilan_Botu.app
          ditto -c -k --norsrc --noextattr --keepParent dist/REMAX_Ilan_Botu.app REMAX-Ilan-Botu-macOS.zip
          shasum -a 256 REMAX-Ilan-Botu-macOS.zip > REMAX-Ilan-Botu-macOS.zip.sha256
          python -c 'import platform; print("Package architecture:", platform.machine())'
      - uses: actions/upload-artifact@v4
        with:
          name: remax-${{ matrix.platform }}
          path: REMAX-Ilan-Botu-${{ matrix.platform }}.zip*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: REMAX İlan Botu — Windows ve Mac
          body: Gerçek masaüstü uygulamaları ve gerekli Chromium bileşeni dahildir. Her iki pakette çevrimdışı Qt, SQLite ve tarayıcı testleri çalıştırılır; hiçbir gerçek hesap veya mesaj gönderimi kullanılmaz. Mac sürümü Apple noter onaylı değildir.
          files: packages/*
          fail_on_unmatched_files: true
