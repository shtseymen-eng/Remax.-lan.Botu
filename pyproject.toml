[build-system]
requires=["setuptools>=70","wheel"]
build-backend="setuptools.build_meta"

[project]
name = "remax-ilan-botu"
version = "0.41.1"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PySide6-Addons>=6.8,<7", "playwright>=1.50,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
remax-ilan-botu="remax_bot.app:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.package-data]
remax_bot=["assets/*"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
