name: Build REMAX Ilan Botu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows-build:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller
          $env:PLAYWRIGHT_BROWSERS_PATH="0"
          python -m playwright install chromium

      - name: Testleri calistir
        run: |
          python -m pytest -q

      - name: Windows EXE olustur
        shell: powershell
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH="0"

          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "REMAX_Ilan_Botu" `
            --icon "src/remax_bot/assets/app_icon.ico" `
            --collect-all playwright `
            --collect-data remax_bot `
            launcher.py

      - name: Windows paketini yukle
        uses: actions/upload-artifact@v4
        with:
          name: REMAX-Ilan-Botu-Windows
          path: dist/REMAX_Ilan_Botu/
          if-no-files-found: error
          retention-days: 30


  macos-build:
    name: macOS APP
    runs-on: macos-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Testleri calistir
        run: |
          python -m pytest -q

      - name: macOS APP olustur
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "REMAX_Ilan_Botu" \
            --icon "src/remax_bot/assets/app_icon.icns" \
            --collect-data remax_bot \
            --hidden-import playwright \
            --hidden-import playwright.sync_api \
            launcher.py

      - name: APP dosyasini ZIP yap
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            REMAX_Ilan_Botu.app \
            REMAX_Ilan_Botu_macOS.zip

      - name: macOS paketini yukle
        uses: actions/upload-artifact@v4
        with:
          name: REMAX-Ilan-Botu-macOS
          path: dist/REMAX_Ilan_Botu_macOS.zip
          if-no-files-found: error
          retention-days: 30
